# クライアント向け REST API の single source of truth (ADR 0010)。
openapi: 3.0.3
info:
  title: dsa-project API
  version: 0.1.0
# Every operation must explicitly declare security and x-access-policy:
# public = security: []; authenticated/admin = sessionAuth with no scopes.
# Startup rejects missing or unsupported declarations before registering routes.
paths:
  /api/session:
    post:
      operationId: createSession
      x-access-policy: public
      security: []
      summary: userid と password でログインする
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "200":
          description: ログインした User Account
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteSession
      x-access-policy: public
      security: []
      summary: 現在のセッションからログアウトする
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: セッションを削除した（セッションがなくても成功）
          headers:
            Set-Cookie:
              schema: { type: string }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/me:
    get:
      operationId: getCurrentUser
      x-access-policy: authenticated
      security: [{ sessionAuth: [] }]
      summary: 現在の User Account を返す
      responses:
        "200":
          description: 現在の User Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/users:
    get:
      operationId: listUserAccounts
      x-access-policy: admin
      security: [{ sessionAuth: [] }]
      summary: List all non-System User Accounts, including disabled accounts, in persisted display order
      responses:
        "200":
          description: All User Accounts, without pagination
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/UserAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createUserAccount
      x-access-policy: admin
      security: [{ sessionAuth: [] }]
      summary: Create a User Account at the end of the global display order
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserAccountRequest" }
      responses:
        "201":
          description: Created User Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "409": { $ref: "#/components/responses/UserConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/admin/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateUserAccount
      x-access-policy: admin
      security: [{ sessionAuth: [] }]
      summary: Atomically update supplied fields of a User Account
      description: |
        Userid is immutable. Last-write-wins; supplying existing values succeeds.
        System Accounts cannot be modified (cannot_modify_system_account).
        An Admin cannot change their own Role or disable themselves (cannot_modify_self).
        Password replacement and transitions to disabled delete all affected sessions
        in the same transaction. Other changes retain sessions. Repeated disabling
        preserves the original disabled timestamp; re-enabling retains the password
        unless a replacement is supplied. Display order is preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserAccountRequest" }
      responses:
        "200":
          description: Updated User Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserAccount" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/UserConflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-dsa_session
  parameters:
    SessionCookie:
      name: __Host-dsa_session
      x-go-name: SessionToken
      in: cookie
      required: false
      schema: { type: string }
  schemas:
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [userid, password]
      properties:
        userid: { type: string, minLength: 1, maxLength: 30 }
        password: { type: string, minLength: 1, maxLength: 256 }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, userid, name, role]
      properties:
        id: { type: string, format: uuid }
        userid: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [student, manager, admin]
    AssignableUserRole:
      type: string
      enum: [student, manager]
      description: Roles assignable through user management; the sole Admin is provisioned separately.
    UserRole:
      type: string
      enum: [student, manager, admin]
    Userid:
      type: string
      minLength: 1
      maxLength: 30
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,29}$'
      description: Immutable, case-sensitive, without trimming or normalization
    DisplayName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[^\p{Cc}]*[^\p{Cc}\p{Z}\s][^\p{Cc}]*$'
      description: 1–64 Unicode characters; no control characters or whitespace-only values; no trimming or normalization
    NewPassword:
      type: string
      minLength: 8
      maxLength: 256
      description: Unicode characters, without trimming, normalization, or character-class rules; confirmation is frontend-only
    UserAccount:
      type: object
      additionalProperties: false
      required: [id, userid, name, role, disabled]
      properties:
        id: { type: string, format: uuid }
        userid: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        disabled: { type: boolean }
    CreateUserAccountRequest:
      type: object
      additionalProperties: false
      required: [userid, name, role, password]
      properties:
        userid: { $ref: "#/components/schemas/Userid" }
        name: { $ref: "#/components/schemas/DisplayName" }
        role: { $ref: "#/components/schemas/AssignableUserRole" }
        password: { $ref: "#/components/schemas/NewPassword" }
    UpdateUserAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: "#/components/schemas/DisplayName" }
        role: { $ref: "#/components/schemas/AssignableUserRole" }
        password: { $ref: "#/components/schemas/NewPassword" }
        disabled: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    ValidationError:
      description: バリデーション失敗
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: 認証情報が無効
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未認証
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Admin Role required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: User Account not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UserConflict:
      description: userid_taken (exact duplicate), cannot_modify_self, or cannot_modify_system_account
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
