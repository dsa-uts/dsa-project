# クライアント向け REST API の single source of truth (ADR 0010)。
openapi: 3.0.3
info:
  title: dsa-project API
  version: 0.1.0
paths:
  /api/session:
    post:
      operationId: createSession
      summary: userid と password でログインする
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "200":
          description: ログインした User Account
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteSession
      summary: 現在のセッションからログアウトする
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "204":
          description: セッションを削除した（セッションがなくても成功）
          headers:
            Set-Cookie:
              schema: { type: string }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/me:
    get:
      operationId: getCurrentUser
      summary: 現在の User Account を返す
      parameters:
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: 現在の User Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  parameters:
    SessionCookie:
      name: __Host-dsa_session
      x-go-name: SessionToken
      in: cookie
      required: false
      schema: { type: string }
  schemas:
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [userid, password]
      properties:
        userid: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, userid, name, role]
      properties:
        id: { type: string, format: uuid }
        userid: { type: string }
        name: { type: string }
        role:
          type: string
          enum: [student, manager, admin]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    ValidationError:
      description: バリデーション失敗
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: 認証情報が無効
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 未認証
      headers:
        Set-Cookie:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
