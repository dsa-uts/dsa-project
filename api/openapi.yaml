# クライアント向け REST API の入口。参照先と合わせて single source of truth。
openapi: 3.1.0
info:
  title: dsa-project API
  version: 0.1.0
  description: |
    Submission upload requests accept bodies up to 21 MB (21,000,000 bytes).
    Other requests accept bodies up to 128 KiB (131,072 bytes).
    Requests exceeding these limits return HTTP 413.
# Every operation must explicitly declare security:
# public = []; authenticated = [{ sessionAuth: [] }].
# sessionAuth accepts one minimum Role: [student], [manager], or [admin].
# Admin inherits Manager and Student permissions; Manager inherits Student permissions.
# At most one security requirement and one Role are supported; no OR/AND declarations.
# Startup rejects missing or unsupported declarations before registering routes.
paths:
  /api/session:
    $ref: './sessions.yaml#/paths/~1api~1session'
  /api/me:
    $ref: './sessions.yaml#/paths/~1api~1me'
  /api/admin/users:
    $ref: './users.yaml#/paths/~1api~1admin~1users'
  /api/admin/users/{user_id}:
    $ref: './users.yaml#/paths/~1api~1admin~1users~1{user_id}'
  /api/users/order:
    $ref: './users.yaml#/paths/~1api~1users~1order'
  /api/projects:
    $ref: './projects.yaml#/paths/~1api~1projects'
  /api/projects/{project_id}:
    $ref: './projects.yaml#/paths/~1api~1projects~1{project_id}'
  /api/admin/projects:
    $ref: './projects.yaml#/paths/~1api~1admin~1projects'
  /api/admin/resource-imports:
    $ref: './resource-imports.yaml#/paths/~1api~1admin~1resource-imports'
  /api/requests/{request_id}/validation:
    $ref: './validation.yaml#/paths/~1api~1requests~1{request_id}~1validation'
  /api/requests/{request_id}/validation/files:
    $ref: './validation.yaml#/paths/~1api~1requests~1{request_id}~1validation~1files'
  /api/requests/{request_id}/validation/artifacts:
    $ref: './validation.yaml#/paths/~1api~1requests~1{request_id}~1validation~1artifacts'
  /api/validation:
    $ref: './validation.yaml#/paths/~1api~1validation'
  /api/projects/{project_id}/validation:
    $ref: './validation.yaml#/paths/~1api~1projects~1{project_id}~1validation'

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: __Host-dsa_session
  parameters:
    SessionCookie:
      $ref: './common.yaml#/parameters/SessionCookie'
  schemas:
    ValidationDetail:
      $ref: './validation.yaml#/schemas/ValidationDetail'
    NullableMeasurement:
      $ref: './validation.yaml#/schemas/NullableMeasurement'
    ValidationResult:
      $ref: './validation.yaml#/schemas/ValidationResult'
    ValidationWorkflow:
      $ref: './validation.yaml#/schemas/ValidationWorkflow'
    ValidationJob:
      $ref: './validation.yaml#/schemas/ValidationJob'
    ValidationStep:
      $ref: './validation.yaml#/schemas/ValidationStep'
    StepOutput:
      $ref: './validation.yaml#/schemas/StepOutput'
    StepExpectation:
      $ref: './validation.yaml#/schemas/StepExpectation'
    ExpectedOutput:
      $ref: './validation.yaml#/schemas/ExpectedOutput'
    ValidationArtifact:
      $ref: './validation.yaml#/schemas/ValidationArtifact'
    ValidationArtifactStatus:
      $ref: './validation.yaml#/schemas/ValidationArtifactStatus'
    FilePart:
      $ref: './validation.yaml#/schemas/FilePart'
    ValidationFilesMetadata:
      $ref: './validation.yaml#/schemas/ValidationFilesMetadata'
    PresetFiles:
      $ref: './validation.yaml#/schemas/PresetFiles'
    ValidationArtifactsMetadata:
      $ref: './validation.yaml#/schemas/ValidationArtifactsMetadata'
    ArtifactPart:
      $ref: './validation.yaml#/schemas/ArtifactPart'
    ValidationPage:
      $ref: './validation.yaml#/schemas/ValidationPage'
    ValidationSummary:
      $ref: './validation.yaml#/schemas/ValidationSummary'
    SubmissionMetadata:
      $ref: './validation.yaml#/schemas/SubmissionMetadata'
    CreatedRequest:
      $ref: './validation.yaml#/schemas/CreatedRequest'
    ProjectUpdate:
      $ref: './projects.yaml#/schemas/ProjectUpdate'
    NullableTimestamp:
      $ref: './projects.yaml#/schemas/NullableTimestamp'
    Status:
      $ref: './common.yaml#/schemas/Status'
    NullableStatus:
      $ref: './common.yaml#/schemas/NullableStatus'
    Project:
      $ref: './projects.yaml#/schemas/Project'
    ProjectDetail:
      $ref: './projects.yaml#/schemas/ProjectDetail'
    CreateSessionRequest:
      $ref: './sessions.yaml#/schemas/CreateSessionRequest'
    CurrentUser:
      $ref: './sessions.yaml#/schemas/CurrentUser'
    AssignableUserRole:
      $ref: './users.yaml#/schemas/AssignableUserRole'
    UserRole:
      $ref: './users.yaml#/schemas/UserRole'
    Userid:
      $ref: './users.yaml#/schemas/Userid'
    DisplayName:
      $ref: './users.yaml#/schemas/DisplayName'
    NewPassword:
      $ref: './users.yaml#/schemas/NewPassword'
    UserAccount:
      $ref: './users.yaml#/schemas/UserAccount'
    CreateUserAccountRequest:
      $ref: './users.yaml#/schemas/CreateUserAccountRequest'
    UpdateUserAccountRequest:
      $ref: './users.yaml#/schemas/UpdateUserAccountRequest'
    Error:
      $ref: './common.yaml#/schemas/Error'
  responses:
    BadRequest:
      $ref: './common.yaml#/responses/BadRequest'
    ValidationError:
      $ref: './common.yaml#/responses/ValidationError'
    InvalidCredentials:
      $ref: './common.yaml#/responses/InvalidCredentials'
    Unauthorized:
      $ref: './common.yaml#/responses/Unauthorized'
    InternalError:
      $ref: './common.yaml#/responses/InternalError'
    Forbidden:
      $ref: './common.yaml#/responses/Forbidden'
    NotFound:
      $ref: './common.yaml#/responses/NotFound'
    UserConflict:
      $ref: './common.yaml#/responses/UserConflict'
