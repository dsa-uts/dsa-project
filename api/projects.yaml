paths:
  /api/projects:
    get:
      operationId: listProjects
      security: [{ sessionAuth: [student] }]
      summary: List Projects in display order
      description: Students see only published Projects; Managers and Admins see all. Workflow summaries come from the latest Version. No private Job or Resource data is exposed.
      responses:
        "200":
          description: All visible Projects, without pagination
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/schemas/Project" }
        "401": { $ref: "./common.yaml#/responses/Unauthorized" }
        "403": { $ref: "./common.yaml#/responses/Forbidden" }
        "500": { $ref: "./common.yaml#/responses/InternalError" }
  /api/projects/{project_id}:
    get:
      operationId: getProject
      security: [{ sessionAuth: [student] }]
      summary: Get the latest Project with all Workflow descriptions
      description: |
        Students see only published Projects; Managers and Admins see all.
        Always returns the latest imported Version. Workflows are sorted by ID
        lexicographically. No Jobs, presets or expected outputs are exposed.
        Markdown attachments are not supported.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest visible Project
          content:
            application/json:
              schema: { $ref: "#/schemas/ProjectDetail" }
        "401": { $ref: "./common.yaml#/responses/Unauthorized" }
        "403": { $ref: "./common.yaml#/responses/Forbidden" }
        "404":
          description: Project not found or not visible
          content:
            application/json:
              schema: { $ref: "./common.yaml#/schemas/Error" }
        "400": { $ref: "./common.yaml#/responses/BadRequest" }
        "500": { $ref: "./common.yaml#/responses/InternalError" }
  /api/admin/projects:
    patch:
      operationId: updateProjects
      security: [{ sessionAuth: [admin] }]
      summary: Save all Project schedules and display order
      description: |
        Supply every Project ID exactly once. The array order becomes the display
        order. Both nullable timestamps are required; if set, published_at must
        not exceed deadline. All changes commit atomically. Last save wins.
        Missing, duplicate, or unknown IDs return project_ids_mismatch.
        An empty array is accepted only when no Projects exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [projects]
              properties:
                projects:
                  type: array
                  items: { $ref: "#/schemas/ProjectUpdate" }
      responses:
        "204": { description: Schedules and order saved; reload GET /api/projects }
        "401": { $ref: "./common.yaml#/responses/Unauthorized" }
        "403": { $ref: "./common.yaml#/responses/Forbidden" }
        "400": { $ref: "./common.yaml#/responses/BadRequest" }
        "409":
          description: Project IDs do not match the complete list; nothing is changed
          content:
            application/json:
              schema: { $ref: "./common.yaml#/schemas/Error" }
        "422":
          description: Deadline precedes publication; nothing is changed
          content:
            application/json:
              schema: { $ref: "./common.yaml#/schemas/Error" }
        "500": { $ref: "./common.yaml#/responses/InternalError" }

schemas:
  ProjectUpdate:
    type: object
    additionalProperties: false
    required: [id, published_at, deadline]
    properties:
      id: { type: string, format: uuid }
      published_at: { $ref: "#/schemas/NullableTimestamp" }
      deadline: { $ref: "#/schemas/NullableTimestamp" }
  NullableTimestamp:
    type: [string, "null"]
    format: date-time
    pattern: 'Z$'
    description: RFC 3339 UTC or null
  Project:
    type: object
    additionalProperties: false
    required: [id, resource_id, name, description, latest_version_id, latest_version, display_order, published_at, deadline, workflows]
    properties:
      id: { type: string, format: uuid }
      resource_id: { type: string }
      name: { type: string }
      description:
        type: string
        description: Plain-text description from the latest Resource.
      latest_version_id: { type: string, format: uuid }
      latest_version: { type: string }
      display_order: { type: integer, format: int64 }
      published_at: { $ref: "#/schemas/NullableTimestamp" }
      deadline: { $ref: "#/schemas/NullableTimestamp" }
      workflows:
        type: array
        items:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
  ProjectDetail:
    type: object
    additionalProperties: false
    required: [id, resource_id, name, description, latest_version_id, latest_version, display_order, published_at, deadline, workflows, required_files]
    properties:
      id: { type: string, format: uuid }
      resource_id: { type: string }
      name: { type: string }
      description:
        type: string
        description: Plain-text description from the latest Resource metadata.
      latest_version_id: { type: string, format: uuid }
      latest_version: { type: string }
      display_order: { type: integer, format: int64 }
      published_at: { $ref: "#/schemas/NullableTimestamp" }
      deadline: { $ref: "#/schemas/NullableTimestamp" }
      required_files:
        type: array
        description: Display-only guidance preserving Resource text and order. Empty when unspecified; not used to validate submissions.
        items: { type: string }
      workflows:
        type: array
        items:
          type: object
          required: [id, name, description_markdown]
          properties:
            id: { type: string }
            name: { type: string }
            description_markdown:
              type: string
              description: Inline Markdown from the snapshot; empty when unspecified. No attachment serving or URL rewriting.
