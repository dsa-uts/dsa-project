# クライアント向け REST API の single source of truth (ADR 0010)。
# ここを変更したら backend / frontend 双方でコードを再生成してコミットする:
#   backend:  cd backend && go generate ./...
#   frontend: cd frontend && npm run generate
# api.md の草稿はエンドポイントの実装時に本ファイルへ移設して削除していく。
openapi: 3.0.3
info:
  title: dsa-project API
  version: 0.1.0
  description: >
    オンラインジャッジ Web アプリのクライアント向け REST API。
    用語と Principles は CONTEXT.md、規約(エラー封筒、ID、タイムスタンプ)は
    docs/spec/api.md の Conventions を正とする。
paths:
  /api/session:
    post:
      operationId: createSession
      summary: セッションを作成する (ログイン)
      description: >
        userid / password を検証してセッション cookie を設定する。
        userid 不存在とパスワード誤りは区別しない (401 invalid_credentials)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: 認証成功。現在の User を返し、セッション cookie を設定する
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly / Secure / SameSite=Lax のセッション cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteSession
      summary: 現在のセッションを削除する (ログアウト)
      description: 冪等。セッションが既に無くても 204 を返す。
      responses:
        "204":
          description: セッション削除済み。cookie を失効させる
          headers:
            Set-Cookie:
              schema:
                type: string
              description: セッション cookie を削除する (Max-Age=0)
        "500":
          $ref: "#/components/responses/InternalError"
  /api/me:
    get:
      operationId: getMe
      summary: 現在の User Account を返す
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 現在の User。sliding session のため cookie を再設定する
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 有効期限を延長したセッション cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    Role:
      type: string
      enum: [student, manager, admin]
      description: User Account の権限レベル (CONTEXT.md「Role」)
    User:
      type: object
      required: [id, userid, name, role]
      properties:
        id:
          type: string
          format: uuid
          description: opaque な UUID 文字列
        userid:
          type: string
          example: "student001"
        name:
          type: string
          example: "山田 太郎"
        role:
          $ref: "#/components/schemas/Role"
    CreateSessionRequest:
      type: object
      required: [userid, password]
      properties:
        userid:
          type: string
          minLength: 1
          example: "student001"
        password:
          type: string
          minLength: 1
          format: password
    Error:
      type: object
      required: [error]
      description: 統一エラー封筒 (api.md Conventions)
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: snake_case の機械可読文字列
              example: validation_failed
            message:
              type: string
              description: 開発者向けの英語文。UI にそのまま表示しない
  responses:
    Unauthorized:
      description: 未認証。セッションなし・期限切れ・credential 不正
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: バリデーション失敗
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: サーバー内部エラー
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: backend-managed session cookie。HttpOnly / Secure / SameSite=Lax
