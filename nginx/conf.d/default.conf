server {
  listen 80;

  server_name localhost;
  server_tokens off;

  # https://example.com/dsa/ 配下で公開するため、
  # 上流から届く /dsa プレフィックスを剥がしてから各コンテナへ転送する

  location /dsa/api {
    # proxy to backend container (/dsa/api/xxx -> /api/xxx)
    proxy_pass http://backend:8000/api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /dsa/ {
    # proxy to frontend container (/dsa/xxx -> /xxx)
    proxy_pass http://frontend:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location = /dsa {
    return 301 /dsa/;
  }

  # limit upload file size to 10MB
  client_max_body_size 10M;
}
