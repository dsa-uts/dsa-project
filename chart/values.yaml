# チューニング可能な値はすべてこのファイルに集約する (仕様の可搬性要件)。
# manifest はクラスタのノード構成を仮定しない (ADR 0008 Topology-Agnostic Manifests)。
#
# image tag は必須 (デフォルト無し)。nix dockerTools のイメージは内容依存の
# tag を持つため、`nix run .#k3s-deploy` が現在の tag を --set で渡す。

backend:
  image:
    repository: dsa-backend
    tag: "" # 必須。空のままだと template がエラーになる
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}

postgresql:
  image:
    repository: postgres
    tag: "17.6"
    pullPolicy: IfNotPresent
  auth:
    # Credentials have no usable defaults. Supply them through a private values
    # file; values-development.yaml is only for the local development release.
    username: ""
    password: ""
    database: ""
  storage:
    size: 1Gi
    # Empty selects the cluster's default StorageClass.
    storageClassName: ""
  resources: {}

redis:
  image:
    repository: redis
    tag: "8.2.1"
    pullPolicy: IfNotPresent
  auth:
    password: ""
  resources: {}

frontend:
  image:
    repository: dsa-frontend
    tag: "" # 必須。空のままだと template がエラーになる
    pullPolicy: IfNotPresent
  replicas: 1
  resources: {}

ingress:
  # k3s 同梱の Traefik を既定とする。他の ingress controller を使う場合に上書きする
  className: traefik
  # 空なら全ホスト名にマッチする。特定ドメインで公開する場合に設定する
  host: ""
