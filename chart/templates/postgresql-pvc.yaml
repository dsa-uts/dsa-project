apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dsa.fullname" . }}-postgresql
  labels:
    {{- include "dsa.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.postgresql.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.storage.size }}
