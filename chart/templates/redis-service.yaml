apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsa.fullname" . }}-redis
  labels:
    {{- include "dsa.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector:
    {{- include "dsa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
