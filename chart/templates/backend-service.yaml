apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsa.fullname" . }}-backend
  labels:
    {{- include "dsa.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "dsa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http
