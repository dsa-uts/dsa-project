apiVersion: v1
kind: Service
metadata:
  name: {{ include "dsa.fullname" . }}-postgresql
  labels:
    {{- include "dsa.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    {{- include "dsa.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
