apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dsa-judge
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dsa-judge
subjects:
  - kind: ServiceAccount
    name: dsa-judge
    namespace: dsa-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dsa-judge

