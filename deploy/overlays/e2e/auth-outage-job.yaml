apiVersion: batch/v1
kind: Job
metadata:
  name: dsa-e2e-auth-outage
  labels:
    app.kubernetes.io/component: e2e
spec:
  # scripts/e2e.nu resumes this Job after normal tests and PostgreSQL shutdown.
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/component: e2e
    spec:
      restartPolicy: Never
      containers:
        - name: e2e
          image: dsa-e2e:required
          imagePullPolicy: IfNotPresent
          args: [/bin/dsa-e2e, --grep, 'authentication backend outage']
          env:
            - name: E2E_BASE_URL
              value: http://traefik.kube-system.svc.cluster.local
            - name: E2E_AUTH_OUTAGE
              value: "1"
          resources: {}
