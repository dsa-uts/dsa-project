apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsa-e2e
resources:
  - namespace.yaml
  - ../../base
  - datastore-secret.yaml
images:
  - name: dsa-backend
    newTag: e2e
  - name: dsa-frontend
    newTag: e2e
patches:
  - target:
      kind: Deployment
      name: dsa-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEVELOPMENT_SEED
          value: "true"
  - target:
      kind: Deployment
      name: dsa-(backend|frontend)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Ingress
      name: dsa
    patch: |-
      - op: add
        path: /spec/rules/0/host
        value: dsa-e2e.k8s.orb.local
      # OrbStack supplies the certificate; Traefik must route TLS on web too.
      - op: add
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.tls
        value: "true"
