apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsa-e2e
resources:
  - namespace.yaml
  - ../../base
  - datastore-secret.yaml
images:
  - name: dsa-backend
    newTag: e2e
  - name: dsa-frontend
    newTag: e2e
  - name: dsa-judge
    newTag: e2e
patches:
  - target:
      kind: Deployment
      name: dsa-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEVELOPMENT_SEED
          value: "true"
  - target:
      kind: Deployment
      name: dsa-(backend|frontend|judge)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: Deployment
      name: dsa-judge
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dsa-judge
      spec:
        template:
          spec:
            containers:
              - name: judge
                env:
                  - name: SANDBOX_NAMESPACE
                    value: dsa-e2e-sandbox
  - target:
      kind: IngressRoute
      name: dsa
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`dsa-e2e.k8s.orb.local`) && Method(`POST`) && PathRegexp(`^/api/projects/[^/]+/validation$`)
      - op: replace
        path: /spec/routes/1/match
        value: Host(`dsa-e2e.k8s.orb.local`) && PathRegexp(`^/(api|health)(/|$)`)
      - op: replace
        path: /spec/routes/2/match
        value: Host(`dsa-e2e.k8s.orb.local`) && PathPrefix(`/`)
      # OrbStack supplies the certificate; Traefik must route TLS on web too.
      - op: add
        path: /spec/tls
        value: {}
