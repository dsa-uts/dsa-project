apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: dsa-backend-secrets
spec:
  provider: openbao
  parameters:
    roleName: dsa-dev-backend
    audience: openbao
    baoAddress: http://openbao.openbao.svc:8200
    objects: |
      - objectName: postgres-password
        secretPath: kv/data/dsa/dev/postgresql
        secretKey: password
        filePermission: 384
      - objectName: redis-password
        secretPath: kv/data/dsa/dev/redis
        secretKey: password
        filePermission: 384
---
apiVersion: secrets-store.csi.x-k8s.io/v1
