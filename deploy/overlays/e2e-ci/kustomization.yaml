apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../e2e
patches:
  - target:
      kind: IngressRoute
      name: dsa
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`e2e.localhost`) && Method(`POST`) && PathRegexp(`^/api/projects/[^/]+/validation$`)
      - op: replace
        path: /spec/routes/1/match
        value: Host(`e2e.localhost`) && PathRegexp(`^/(api|health)(/|$)`)
      - op: replace
        path: /spec/routes/2/match
        value: Host(`e2e.localhost`) && PathPrefix(`/`)
      - op: remove
        path: /spec/tls
