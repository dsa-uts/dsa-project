apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dsa-dev
resources:
  - namespace.yaml
  - ../../base
  - datastore-secret.yaml
images:
  - name: dsa-backend
    newTag: dev
  - name: dsa-frontend
    newTag: dev
  - name: dsa-judge
    newTag: dev
patches:
  - target:
      kind: Deployment
      name: dsa-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEVELOPMENT_SEED
          value: "true"
  - target:
      kind: Deployment
      name: dsa-(backend|frontend|judge)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
  - target:
      kind: IngressRoute
      name: dsa
    patch: |-
      - op: replace
        path: /spec/routes/0/match
        value: Host(`dsa.k8s.orb.local`) && Method(`POST`) && PathRegexp(`^/api/projects/[^/]+/validation$`)
      - op: replace
        path: /spec/routes/1/match
        value: Host(`dsa.k8s.orb.local`) && PathRegexp(`^/(api|health)(/|$)`)
      - op: replace
        path: /spec/routes/2/match
        value: Host(`dsa.k8s.orb.local`) && PathPrefix(`/`)
      # OrbStack supplies the certificate; Traefik must route TLS on web too.
      - op: add
        path: /spec/tls
        value: {}
