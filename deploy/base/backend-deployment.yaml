apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsa-backend
  labels:
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsa
      app.kubernetes.io/instance: dsa
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/instance: dsa
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: dsa-backend:required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dsa-datastore
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: dsa-datastore
                  key: redis-url
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources: {}
