apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsa-backend
  labels:
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsa
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: dsa-backend
      containers:
        - name: backend
          image: dsa-backend:required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_HOST
              value: dsa-postgresql
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: dsa
            - name: DATABASE_NAME
              value: dsa
            - name: DATABASE_PASSWORD_FILE
              value: /run/secrets/dsa/postgres-password
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources: {}
          volumeMounts:
            - name: datastore-secrets
              mountPath: /run/secrets/dsa
              readOnly: true
      volumes:
        - name: datastore-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: dsa-backend-secrets
