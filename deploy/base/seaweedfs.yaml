apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dsa-seaweedfs
  labels:
    app.kubernetes.io/component: seaweedfs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dsa-seaweedfs
  labels:
    app.kubernetes.io/component: seaweedfs
spec:
  selector:
    app.kubernetes.io/name: dsa
    app.kubernetes.io/component: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsa-seaweedfs
  labels:
    app.kubernetes.io/component: seaweedfs
spec:
  serviceName: dsa-seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsa
      app.kubernetes.io/component: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/component: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.47
          imagePullPolicy: IfNotPresent
          args:
            - mini
            - -dir=/data
            - -s3.port=8333
          ports:
            - name: s3
              containerPort: 8333
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: dsa-datastore
                  key: s3-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dsa-datastore
                  key: s3-secret-access-key
            - name: S3_BUCKET
              value: dsa-files
          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dsa-seaweedfs

