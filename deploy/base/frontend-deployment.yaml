apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsa-frontend
  labels:
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsa
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: dsa-frontend:required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources: {}
