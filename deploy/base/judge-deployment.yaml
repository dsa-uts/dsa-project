apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsa-judge
  labels:
    app.kubernetes.io/component: judge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsa
      app.kubernetes.io/component: judge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/component: judge
    spec:
      serviceAccountName: dsa-judge
      containers:
        - name: judge
          image: dsa-judge:required
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_HOST
              value: dsa-postgresql
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              value: dsa
            - name: DATABASE_NAME
              value: dsa
            - name: DATABASE_PASSWORD_FILE
              value: /run/secrets/dsa/postgres-password
            - name: SANDBOX_NAMESPACE
              value: dsa-dev-sandbox
          resources: {}
          volumeMounts:
            - name: datastore-secrets
              mountPath: /run/secrets/dsa
              readOnly: true
      volumes:
        - name: datastore-secrets
          secret:
            secretName: dsa-datastore
