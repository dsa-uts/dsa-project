apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsa-postgresql
  labels:
    app.kubernetes.io/component: postgresql
spec:
  serviceName: dsa-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsa
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/component: postgresql
    spec:
      serviceAccountName: dsa-postgresql
      containers:
        - name: postgresql
          image: postgres:17.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: dsa
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/dsa/postgres-password
            - name: POSTGRES_DB
              value: dsa
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          resources: {}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: datastore-secrets
              mountPath: /run/secrets/dsa
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dsa-postgresql
        - name: datastore-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: dsa-postgresql-secrets
