apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsa
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: dsa-backend
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dsa-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsa-frontend
                port:
                  name: http
