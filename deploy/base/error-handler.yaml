apiVersion: v1
kind: ConfigMap
metadata:
  name: dsa-error-handler
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      default_type application/json;
      add_header Cache-Control "no-store" always;

      location = /413 {
        return 413 '{"code":413,"message":"Request body is too large."}';
      }

      location = /health {
        return 200 '{"status":"ok"}';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsa-error-handler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: error-handler
  template:
    metadata:
      labels:
        app.kubernetes.io/component: error-handler
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dsa-error-handler
---
apiVersion: v1
kind: Service
metadata:
  name: dsa-error-handler
spec:
  selector:
    app.kubernetes.io/component: error-handler
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: json-body-too-large
spec:
  errors:
    status:
      - "413"
    service:
      name: dsa-error-handler
      port: 8080
    query: /413
