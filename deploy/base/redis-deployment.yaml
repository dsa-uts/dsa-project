apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsa-redis
  labels:
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dsa
      app.kubernetes.io/instance: dsa
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dsa
        app.kubernetes.io/instance: dsa
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:8.2.1
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args: ['exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"']
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsa-datastore
                  key: redis-password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: dsa-datastore
                  key: redis-password
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
          resources: {}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
