# Shared by OrbStack and k3d; both provide LoadBalancer services.
ingressClass:
  enabled: true
  name: traefik
  isDefaultClass: false
providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: true
    ingressClass: traefik
service:
  type: LoadBalancer
ports:
  web:
    exposedPort: 80
  websecure:
    expose:
      default: false
api:
  dashboard: false
