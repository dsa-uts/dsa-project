services:
  frontend:
    build:
      context: .
      dockerfile: dsa-frontend/Dockerfile.dev
    volumes:
      - ./dsa-frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:15173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:18000/api
    entrypoint: [sh, -c, "npm ci && npm run dev -- --host --strictPort"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 150

  backend:
    build:
      context: .
      dockerfile: dsa-backend/Dockerfile.dev
    volumes:
      - ./dsa-backend:/app
      - ./database:/database:ro
      - uploads:/app/upload
      - backend-go-modules:/go
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      APP_ENV: development
      CORS_ALLOWED_ORIGINS: http://localhost:15173
    secrets: [db_app_password, admin_info_json]
    restart: "no"
    entrypoint: [sh, -c, "go build -o /tmp/dsa-backend . && exec /tmp/dsa-backend"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8000/swagger/index.html]
      interval: 2s
      timeout: 5s
      retries: 150

  judge:
    build:
      context: .
      dockerfile: dsa-judgeserver/Dockerfile.dev
    volumes:
      - ./dsa-judgeserver:/app
      - ./database:/database:ro
      - uploads:/app/upload
      - judge-go-modules:/go
    secrets: [db_app_password]
    restart: "no"
    entrypoint: [sh, -c, "go build -o /tmp/dsa-judge . && exec /tmp/dsa-judge"]
    healthcheck:
      test: [CMD-SHELL, 'test "$$(readlink /proc/1/exe)" = /tmp/dsa-judge']
      interval: 2s
      timeout: 5s
      retries: 150

  db:
    secrets: [db_app_password, db_root_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - backup:/backup

volumes:
  frontend-node-modules:
  backend-go-modules:
  judge-go-modules:
  uploads:
  db-data:
  backup:

secrets:
  db_app_password:
    file: ./e2e/config/db_app_password.txt
  db_root_password:
    file: ./e2e/config/db_root_password.txt
  admin_info_json:
    file: ./e2e/config/admin.json
