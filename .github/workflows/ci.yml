# PR と main push で nix flake check を回す最小 CI。
# x86_64-linux の checks には backend-image / frontend-image が含まれるため、
# flake check だけでコンテナイメージのビルド検証もカバーされる (flake.nix 参照)。
# キャッシュは GitHub Actions cache に /nix/store を保存する cache-nix-action を使う
# (magic-nix-cache は 2025-02 にサービス終了)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一 ref の実行は 1 つに絞り、PR への連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-nix-action の purge (古いキャッシュの削除) に必要
  actions: write

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          # GC でツールチェインや flake input が飛ばないよう保持する
          # (cache-nix-action の README 推奨設定)
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # 依存が変わると *.nix の vendorHash / npmDepsHash も変わるので、
          # このキーで go / npm 依存の変更まで追従できる
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # 保存前に GC してキャッシュサイズを抑える (repo 全体の上限は 10GB)
          gc-max-store-size-linux: 4G
          # 現在の ref のキャッシュのうち、primary-key 以外の古い世代を削除する
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # backend build より先に実行し、stale hash では Nix の hash mismatch ではなく
      # 修復コマンドを含む専用エラーを表示する。check は checkout を変更しない。
      - name: Check backend dependency metadata
        run: nix develop -c task backend:deps:check

      - name: nix flake check
        run: nix develop -c task check

      # flake check でビルド済みなのでここはほぼ no-op だが、
      # イメージビルドの成否を独立したステップとして見えるようにする
      - name: Build container images
        run: nix develop -c task images:build

  # openapi.yaml と生成コードの同期を検査する (ADR 0010)。
  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-devshell-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Install frontend dependencies
        run: nix develop -c task frontend:install

      - name: Check codegen drift
        run: nix develop -c task codegen:check
