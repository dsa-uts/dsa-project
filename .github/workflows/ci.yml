# PR と main push で nix flake check を回す最小 CI。
# x86_64-linux の checks には backend-image / frontend-image が含まれるため、
# flake check だけでコンテナイメージのビルド検証もカバーされる (flake.nix 参照)。
# キャッシュは GitHub Actions cache に /nix/store を保存する cache-nix-action を使う
# (magic-nix-cache は 2025-02 にサービス終了)。
name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTEXT.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CONTEXT.md'
      - 'CLAUDE.md'
      - 'LICENSE'

# 同一 ref の実行は 1 つに絞り、PR への連続 push では古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # cache-nix-action の purge (古いキャッシュの削除) に必要
  actions: write

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          # GC でツールチェインや flake input が飛ばないよう保持する
          # (cache-nix-action の README 推奨設定)
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # 依存が変わると *.nix の vendorHash / npmDepsHash も変わるので、
          # このキーで go / npm 依存の変更まで追従できる
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # 保存前に GC してキャッシュサイズを抑える (repo 全体の上限は 10GB)
          gc-max-store-size-linux: 4G
          # 現在の ref のキャッシュのうち、primary-key 以外の古い世代を削除する
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      # backend build より先に実行し、stale hash では Nix の hash mismatch ではなく
      # 修復コマンドを含む専用エラーを表示する。check は checkout を変更しない。
      - name: Check backend dependency metadata
        run: nix develop -c task backend:deps:check

      - name: nix flake check
        run: nix develop -c task check

      # flake check でビルド済みなのでここはほぼ no-op だが、
      # イメージビルドの成否を独立したステップとして見えるようにする
      - name: Build container images
        run: nix develop -c task images:build

  # openapi.yaml と生成コードの同期を検査する (ADR 0010)。
  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-devshell-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-devshell-${{ runner.os }}-
          gc-max-store-size-linux: 4G
          purge: true
          purge-prefixes: nix-devshell-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Install frontend dependencies
        run: nix develop -c task frontend:install

      - name: Check codegen drift
        run: nix develop -c task codegen:check

  deployed-e2e:
    needs: flake-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      K3D_CLUSTER: dsa-e2e
      E2E_BASE_URL: http://e2e.localhost:8080
    steps:
      - uses: actions/checkout@v5

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Restore Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: false

      - name: Resolve the E2E ingress hostname on the host
        run: echo '127.0.0.1 e2e.localhost' | sudo tee -a /etc/hosts

      - name: Create k3d cluster
        run: nix develop -c k3d cluster create "$K3D_CLUSTER" --port '8080:80@loadbalancer' --wait --timeout 2m

      - name: Install host test dependencies
        run: nix develop -c task e2e:install

      - name: Deploy E2E applications
        run: nix develop -c task e2e:up -- --k3d-cluster "$K3D_CLUSTER"

      - name: Reset E2E database
        id: reset
        run: nix develop -c task e2e:reset

      - name: Run deployed public-interface tests
        run: nix develop -c task e2e:test

      - name: Run authentication outage tests
        if: ${{ !cancelled() && steps.reset.outcome == 'success' }}
        run: nix develop -c task e2e:test:outage

      - name: Save Kubernetes diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p e2e/diagnostics
          nix develop -c task e2e:diagnostics > e2e/diagnostics/kubernetes.log 2>&1

      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployed-e2e-diagnostics
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/diagnostics/

      - name: Delete E2E environment
        if: ${{ always() }}
        run: nix develop -c task e2e:down

      - name: Delete k3d cluster
        if: ${{ always() }}
        run: nix develop -c k3d cluster delete "$K3D_CLUSTER"
