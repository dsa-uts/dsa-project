version: '3'

silent: true

tasks:
  default:
    desc: List available development tasks
    cmds:
      - task --list

  backend:test:
    desc: Run backend unit tests
    dir: backend
    cmds:
      - go test ./...

  backend:deps:refresh:
    desc: Refresh the backend Nix dependency hash
    cmds:
      - nu scripts/backend-deps.nu refresh

  backend:deps:check:
    desc: Check the backend Nix dependency hash
    cmds:
      - nu scripts/backend-deps.nu check

  backend:image:build:
    desc: Refresh dependencies and build the backend container image
    deps:
      - backend:deps:refresh
    cmds:
      - nix build .#backend-image

  frontend:install:
    desc: Install frontend dependencies from the lockfile
    dir: frontend
    cmds:
      - npm ci

  frontend:test:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - npm test

  frontend:typecheck:
    desc: Type-check the frontend
    dir: frontend
    cmds:
      - npm run typecheck

  frontend:lint:
    desc: Lint the frontend
    dir: frontend
    cmds:
      - npm run lint

  frontend:image:build:
    desc: Build the frontend container image
    cmds:
      - nix build .#frontend-image

  images:build:
    desc: Build application container images
    cmds:
      - nix build -L .#backend-image .#frontend-image

  e2e:install:
    desc: Install host test dependencies from the lockfile
    dir: e2e
    cmds:
      - npm ci

  e2e:up:
    desc: Build and deploy E2E applications, preserving existing data
    cmds:
      - nu scripts/e2e.nu up {{.CLI_ARGS}}

  e2e:reset:
    desc: Clear the E2E database and apply migrations and seed
    cmds:
      - nu scripts/e2e.nu reset

  e2e:test:
    aliases: [test]
    desc: Run host Playwright tests against the existing deployment
    dir: e2e
    cmds:
      - npm test -- {{.CLI_ARGS}}

  e2e:test:outage:
    desc: Stop the E2E database, test authentication failures, and restore it
    cmds:
      - bash scripts/e2e-outage.sh {{.CLI_ARGS}}

  e2e:typecheck:
    dir: e2e
    cmds:
      - npm run typecheck

  e2e:diagnostics:
    desc: Print E2E workload logs and events
    cmds:
      - nu scripts/e2e.nu diagnostics

  e2e:down:
    desc: Delete the E2E namespace and its data
    cmds:
      - nu scripts/e2e.nu down

  codegen:generate:
    desc: Generate backend and frontend code from the OpenAPI contract
    cmds:
      - nu scripts/codegen.nu generate

  codegen:check:
    desc: Check generated code for drift
    cmds:
      - nu scripts/codegen.nu check

  deploy:
    desc: Build and deploy the complete application to the configured k3s cluster
    cmds:
      - nu scripts/deploy.nu deploy

  status:
    desc: Show the status of the development deployment
    cmds:
      - nu scripts/deploy.nu status

  logs:
    desc: Show logs for a development component (backend, frontend, postgresql, or all)
    cmds:
      - nu scripts/deploy.nu logs {{.CLI_ARGS}}

  reset:
    desc: Delete the dsa-dev namespace and its development data
    cmds:
      - nu scripts/deploy.nu reset

  check:
    desc: Run all Nix flake checks
    cmds:
      - nix flake check -L
